# Cross-ISA differential / oracle validation.
#
# Many of rax's strongest tests diff the emulator against an independent oracle
# (QEMU user-mode, plus llvm-mc as an assembler and a cross gcc/clang). Those
# harnesses *skip gracefully* when the oracle binaries are absent (that is why
# ci.yml stays green without them) — here we install the oracles so the diffs
# actually run. One job per guest architecture so they parallelize and a slow
# QEMU corpus never blocks the others.
#
# Scheduled + on demand only: spawning QEMU across the large generated corpora is
# far too slow for the push gate.
name: Differential

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: differential-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FEATURES: "--no-default-features --features x86_64-suite,smir-jit"

jobs:
  diff:
    name: diff ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            tests: "--test x86_64_evex_qemu_diff --test x86_64_unimplemented_qemu_diff --test x86_64_avx512_inventory"
            experimental: false
          - arch: arm
            tests: "--test arm_diff --test arm_diff32"
            experimental: false
          - arch: riscv
            tests: "--test riscv_diff --test riscv_vector --test riscv_smir_lift"
            experimental: false
          - arch: hexagon
            tests: "--test hexagon_diff --test hexagon_cf_diff --test hexagon_float_diff --test hexagon_mem_diff --test hexagon_hvx_diff --test hexagon_hvx_mem_diff --test hexagon_smir_lift"
            # The hardware-oracle control-flow corpus currently reports known
            # semantic divergences. Keep executing and reporting it nightly,
            # but do not make unrelated workflow health depend on that backlog.
            experimental: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          cache-key: diff-${{ matrix.arch }}

      - name: Install oracle toolchain (qemu-user + llvm + cross gcc)
        run: |
          set -euxo pipefail
          sudo apt-get update
          # qemu-user provides qemu-x86_64 / qemu-aarch64 / qemu-arm / qemu-riscv64
          # (and qemu-hexagon on recent releases). llvm/lld provide llvm-mc,
          # ld.lld, llvm-nm, llvm-objcopy (version-suffixed). clang/binutils for
          # the C oracle. gcc-riscv64-linux-gnu satisfies RISCV64_CC.
          # qemu-user (dynamic) is preferred over qemu-user-static, which has a
          # known segfault on some ubuntu-24.04 image builds (runner-images
          # #11662). The harnesses exec the qemu-<arch> binaries directly, so no
          # binfmt registration is needed.
          sudo apt-get install -y --no-install-recommends \
            qemu-user \
            llvm lld clang \
            binutils \
            gcc-riscv64-linux-gnu

      - name: Resolve LLVM tools onto PATH (unsuffixed names)
        run: |
          set -euxo pipefail
          # The harnesses look for unsuffixed `llvm-mc`, `ld.lld`, etc. Ubuntu
          # ships them version-suffixed under /usr/lib/llvm-*/bin — put the newest
          # such dir on PATH and pin LLVM_MC explicitly.
          LLVM_MC_BIN="$(find /usr/lib -path '/usr/lib/llvm-*/bin/llvm-mc' -type f -print 2>/dev/null | sort -V | tail -1)"
          if [ -z "$LLVM_MC_BIN" ]; then LLVM_MC_BIN="$(command -v llvm-mc || true)"; fi
          if [ -n "$LLVM_MC_BIN" ]; then
            LLVM_DIR="$(dirname "$LLVM_MC_BIN")"
            echo "$LLVM_DIR" >> "$GITHUB_PATH"
            echo "LLVM_MC=$LLVM_MC_BIN" >> "$GITHUB_ENV"
          fi
          {
            echo "CC=clang"
            echo "QEMU_X86_64=qemu-x86_64"
            echo "QEMU_AARCH64=qemu-aarch64"
            echo "QEMU_RISCV64=qemu-riscv64"
            echo "QEMU_ARM=qemu-arm"
            echo "RISCV64_CC=riscv64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"

      - name: Report available oracles
        run: |
          for t in qemu-x86_64 qemu-aarch64 qemu-arm qemu-riscv64 qemu-hexagon \
                   llvm-mc ld.lld llvm-nm llvm-objcopy clang cc riscv64-linux-gnu-gcc; do
            printf '%-24s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done

      - name: Probe complete APX assembler support
        id: apx
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          read -r -a features <<< "$FEATURES"
          if cargo test "${features[@]}" --test x86_64_apx_map4_qemu_diff \
              apx_map4_generated_corpus_covers_families_and_assembles \
              -- --exact --nocapture; then
            echo 'tests=--test x86_64_apx_map4_qemu_diff' >> "$GITHUB_OUTPUT"
          else
            echo 'tests=' >> "$GITHUB_OUTPUT"
            echo '::notice::Skipping APX MAP4 differential corpus: installed llvm-mc lacks required APX syntax support.'
          fi

      - name: Probe complete generated EVEX assembler support
        id: evex
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          read -r -a features <<< "$FEATURES"
          if cargo test "${features[@]}" --test x86_64_evex_qemu_diff \
              evex_generated_corpus_covers_supported_selectors_and_forms \
              -- --exact --nocapture; then
            echo 'skips=' >> "$GITHUB_OUTPUT"
          else
            echo 'skips=--skip evex_generated_corpus_covers_supported_selectors_and_forms --skip qemu_evex_generated_corpus_matches_rax' >> "$GITHUB_OUTPUT"
            echo '::notice::Skipping generated EVEX differential corpora: installed llvm-mc does not assemble every required selector/form.'
          fi

      - name: cargo test (${{ matrix.arch }} differential)
        env:
          MATRIX_TESTS: ${{ matrix.tests }}
          APX_TESTS: ${{ steps.apx.outputs.tests }}
          EVEX_SKIPS: ${{ steps.evex.outputs.skips }}
        run: |
          read -r -a features <<< "$FEATURES"
          read -r -a matrix_tests <<< "$MATRIX_TESTS"
          read -r -a apx_tests <<< "$APX_TESTS"
          read -r -a evex_skips <<< "$EVEX_SKIPS"
          # These ignored inventories intentionally assert transitional backlog
          # states; they are developer reports, not oracle differential tests.
          cargo test "${features[@]}" "${matrix_tests[@]}" "${apx_tests[@]}" -- \
            --include-ignored \
            --skip report_evex_spec_forms_rejected_by_smir_lifter \
            --skip qemu_evex_unimplemented_avx512_corpus_matches_rax_when_enabled \
            "${evex_skips[@]}" \
            --nocapture
